# Secrets: DB credentials and the JWT signing key.
# NOTE: stringData values are plaintext here for demo clarity. In a real
# cluster use a sealed-secrets controller, SOPS, or an external secrets store,
# and never commit real credentials to git.
apiVersion: v1
kind: Secret
metadata:
  name: lms-secrets
  namespace: lms
type: Opaque
stringData:
  # Application / backend
  JWT_SECRET: "change-me-to-a-long-random-string"
  DB_USER: "lms"
  DB_PASSWORD: "lms-strong-password"
---
# Postgres reads the same credentials so the DB and app stay in sync.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: lms
type: Opaque
stringData:
  POSTGRES_USER: "lms"
  POSTGRES_PASSWORD: "lms-strong-password"
  POSTGRES_DB: "lms"
