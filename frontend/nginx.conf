# nginx serves the built SPA and proxies /api to the backend Service.
# BACKEND_URL is substituted at container start via envsubst (see Dockerfile
# CMD), so the same image works in compose and Kubernetes.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown routes serve index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend service.
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Allow large video uploads to flow through to the backend.
        client_max_body_size 512m;
        proxy_read_timeout 300s;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
